services:
  stacktrace-translator:
    build: .
    container_name: stacktrace-translator
    restart: unless-stopped
    ports:
      - "80:8050"     # Dash frontend
      - "8000:8000"   # XML-RPC backend (external services)
    volumes:
      - ./log:/usr/src/app/logs/
    healthcheck:
      # Reports container health (visible in `docker ps`). The entrypoint exits
      # if either process dies, and `restart: unless-stopped` brings it back up.
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8000 > /dev/null && curl -fs http://127.0.0.1:8050 > /dev/null || exit 1"]
      interval: 60s
      retries: 5
      start_period: 20s
      timeout: 10s
